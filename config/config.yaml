### Per device confing


###############################################################################
#                   Change to localize for your project 
###############################################################################

# Name of the overarching project.  
# Uncomment this line to always assoicate this device with a specific project. 
# project: "my_project_name"

# name of the platform  
robot_name: "my_robot_name"

# Optional: fixed id in this device's source name (DEV-<robot_name>-<id>).
# Letters, digits and dots only. When unset, an id is generated once and kept in
# <this file without extension>.identity (or IDENTITY_FILE).
# source_id: bs01

# API key to log into the server
API_KEY_TOKEN: cbea87b419c09982

# which directories to watch for files to upload
watch:
  - /mnt/data/project

# Optional: directories never to walk, e.g. a MinIO or database data dir inside a watch root.
# Glob per path component. A bare name matches at any depth; a relative path is from the
# watch root; an absolute path is as the device sees it. Files inside are never sent or deleted.
# exclude_dirs:
#   - chiron_data
#   - chiron_backup/sessions/*/minio

# Optional: folders uploaded as one .tar each ("Folder Bundles" on the dashboard). Python regexes
# matched against the whole folder name. The scan does not enter a matching folder: everything in
# it, whatever its suffix, is uploaded inside <folder>.<hash8>.tar. A folder is bundled once nothing
# in it changed for bundle_settle_s seconds; a later change uploads a new version.
# bundle_dirs:
#   - '\d{4}(_\d{2}){5}\.tmux'      # tmux pane-log runs, tmux/2026_10_24_03_10_58.tmux/
# bundle_settle_s: 600


# Timezone used when converting UTC to local time
local_tz: "America/New_York"

# IP address and ports of all known servers
# The Device will by default use ZeroConf to find the nearest server.
# The Device will check these hosts for if ZeroConf fails to find a server. 

servers:
  -  "airlab-storage.andrew.cmu.edu:8091"


###############################################################################
# Operational configurations
###############################################################################


# How many parallel threads for uploads
threads: 4

# What kinds of files to search for.  
# Comment out types to avoid.  
include_suffix:
  - mcap
  - mp4 
  - png 
  - txt
  - bag 
  - ass
  - yaml

# How many seconds to wait before checking servers again
wait_s: 5